[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "service-template"
version = "0.1.0"
description = "服务模板（用户服务原型）：本地事务 + Outbox + 数据级授权"
requires-python = ">=3.12"
dependencies = [
  "ai-kernel>=0.1.0",
  "ai-contract-sdk>=0.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "alembic>=1.13", "aiosqlite>=0.20"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
# FastAPI 依赖注入惯用写法
"app/**" = ["B008"]