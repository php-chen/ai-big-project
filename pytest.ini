[pytest]
asyncio_mode = auto
addopts = --import-mode=importlib
pythonpath = .
testpaths = tests
markers =
    integration: 需要真实中间件（Docker）的集成测试（定律4 全链路）
    e2e: 跨服务端到端测试（自动启动 uvicorn 子进程）
filterwarnings =
    ignore:Using `httpx` with `starlette.testclient` is deprecated
    ignore:'asyncio.WindowsSelectorEventLoopPolicy' is deprecated
    ignore:'asyncio.set_event_loop_policy' is deprecated
    ignore:The @wait_container_is_ready decorator is deprecated