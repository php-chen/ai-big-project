# 开发中间件基座（方向一：版本下限统一）
# PostgreSQL 主从（流复制，读写分离）+ Redis + RabbitMQ；启动：docker compose up -d
services:
  postgres:            # 主库（写）
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
      POSTGRES_HOST_AUTH_METHOD: trust   # 开发简化；生产用 scram（见 deploy/）
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
      - -c
      - hot_standby=on
      - -c
      - hba_file=/config/pg_hba.conf
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/init-repl.sql:/docker-entrypoint-initdb.d/10-init-repl.sql:ro
      - ./deploy/postgres/pg_hba.conf:/config/pg_hba.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 3s
      retries: 12

  postgres-replica:    # 从库（读）：pg_basebackup + 流复制
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_HOST_AUTH_METHOD: trust
      PGPASSWORD: replpass
    entrypoint: ["/bin/sh", "/usr/local/bin/replica-entrypoint.sh"]
    ports:
      - "5433:5432"
    volumes:
      - pgreplica:/var/lib/postgresql/data
      - ./deploy/postgres/replica-entrypoint.sh:/usr/local/bin/replica-entrypoint.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"      # AMQP
      - "15672:15672"    # 管理台
    volumes:
      - mqdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  pgreplica:
  redisdata:
  mqdata: