[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-kernel"
version = "0.1.0"
description = "AI大项目共享内核：无业务属性的基础设施能力（配置/日志/追踪/异常/鉴权/DB/Outbox/事件/健康/指标/注册）"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "sqlalchemy[asyncio]>=2.0",
  "redis>=5",
  "aio-pika>=9",
  "opentelemetry-api>=1.27",
  "opentelemetry-sdk>=1.27",
  "prometheus-client>=0.20",
  "httpx>=0.27",
  "ai-contract-sdk>=0.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "alembic>=1.13", "aiosqlite>=0.20"]

[tool.setuptools.packages.find]
include = ["kernel*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
# FastAPI 依赖注入惯用写法（Depends 出现在参数默认值）
"kernel/**" = ["B008"]
"tests/**" = ["B008"]