# Prometheus 抓取配置（资源监控）
# 数据源：node-exporter（宿主机）、cAdvisor（容器）、各服务 /metrics、自动扩缩器
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerting-rules.yml

scrape_configs:
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["gateway:8000", "gateway-2:8000", "gateway-3:8000"]

  - job_name: service-template
    metrics_path: /metrics
    static_configs:
      - targets: ["service-template:8100", "service-template-2:8100", "service-template-3:8100"]

  - job_name: autoscaler
    metrics_path: /metrics
    static_configs:
      - targets: ["autoscaler:8200"]