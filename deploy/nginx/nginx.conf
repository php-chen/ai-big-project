# 边缘负载均衡（Nginx）：入口流量分发到多个网关副本
# 健康感知：max_fails + fail_timeout（被动健康检查），配合容器 HEALTHCHECK
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # 网关副本（compose 服务名 -> 内部端口；实例故障自动剔除）
    upstream gateway_servers {
        least_conn;
        server gateway:8000 max_fails=3 fail_timeout=30s;
        server gateway-2:8000 max_fails=3 fail_timeout=30s;
        server gateway-3:8000 max_fails=3 fail_timeout=30s;
    }

    server {
        listen 80;
        server_name _;

        # TLS 终止（生产启用）：
        # listen 443 ssl;
        # ssl_certificate     /etc/nginx/certs/server.crt;
        # ssl_certificate_key /etc/nginx/certs/server.key;

        gzip on;
        client_max_body_size 10m;

        location / {
            proxy_pass http://gateway_servers;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }
    }
}